<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nokime a déménagé</title>
<meta name="robots" content="noindex">
<script>
var p = location.pathname, pre = '/nokime/';
var rest = p.indexOf(pre) === 0 ? p.slice(pre.length) : "";
location.replace('https://nokime.fr/' + rest + location.search + location.hash);
</script>
</head>
<body><p>Le site est maintenant à <a href="https://nokime.fr/">https://nokime.fr/</a>.</p></body>
</html>
